; Xdebug configuration for local development.
; Extension is loaded by the php8.5-xdebug package — do not add zend_extension here.
; host.docker.internal resolves to the host machine (see extra_hosts in docker-compose.yml).

[xdebug]
xdebug.mode=debug
xdebug.start_with_request=yes
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.discover_client_host=false
xdebug.log_level=0
xdebug.log=/tmp/xdebug.log