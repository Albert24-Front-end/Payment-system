; PHP-CLI configuration for console commands (composer, artisan, etc.).
; Edit this file locally — it is mounted into the container.

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 0
zlib.output_compression = Off
implicit_flush = On
serialize_precision = -1
zend.enable_gc = On
zend.exception_ignore_args = On

expose_php = On
max_execution_time = 0
max_input_time = -1
memory_limit = 512M
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /proc/self/fd/2

post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20

default_charset = "UTF-8"

[Date]
date.timezone = UTC

[opcache]
opcache.enable = 0
opcache.enable_cli = 0
